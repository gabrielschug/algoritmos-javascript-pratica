<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo 11.1</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/174/174854.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-4">
        <img
          src="https://images.pexels.com/photos/1462366/pexels-photo-1462366.jpeg?_gl=1*1oc2y2h*_ga*MzE3NTc1Mzg5LjE3NjI0NjA2NTg.*_ga_8JE65Q40S6*czE3ODU5ODA1MjgkbzI5JGcxJHQxNzg1OTgxMzM1JGo0OSRsMCRoMA.."
          alt="Jockey Club" class="alta">
      </div>
      <div class="col-sm-8">
        <h1>Jockey Club - Controle de Apostas</h1>
        <form>
          <div class="row">
            <div class="col-sm-6">
              <label for="inCavalo">Nº do Cavalo:</label>
              <input type="number" min="1" class="form-control" id="inCavalo" required autofocus>
            </div>
            <div class="col-sm-6">
              <h5 id="outCavalo" class="mt-4"></h5>
            </div>
          </div>
          <div class="row">
            <div class="col-sm-6">
              <label for="inAposta">Aposta R$:</label>
              <input type="number" min="1" step="0.5" class="form-control" id="inAposta" required>
            </div>
            <div class="col-sm-6">
              <input type="submit" class="btn btn-primary mt-4" value="Apostar" id="btApostar">
              <input type="button" class="btn btn-warning mt-4" value="Resumo" id="btResumo">
              <input type="button" class="btn btn-success mt-4" value="Ganhador" id="btGanhador">
              <input type="button" class="btn btn-danger mt-4" value="Novo Páreo" id="btNovoPareo">
            </div>
          </div>
        </form>
        <pre class="mt-3"></pre>
      </div>
    </div>
  </div>
  <script src="js/ex11.1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
