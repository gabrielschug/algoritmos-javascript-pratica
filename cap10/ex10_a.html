<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo 10.a</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/174/174854.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container-fluid">
    <div class="row mt-4">
      <div class="col-sm-3">
        <!-- imagem -->
      </div>
      <div class="col-sm-6" id="divPrincipal">
        <h1>Velas de Aniversário</h1>
        <form>
          <p>
            <label for="inIdade">Idade:</label>
            <input type="number" min="1" max="120" class="form-control" id="inIdade" required autofocus>
          </p>
          <input type="submit" class="btn btn-primary float-right mb-3" value="Exibir Velas">
          <input type="button" class="btn btn-success float-right mb-3" value="Novas Velas" id="btNovasVelas">
        </form>
      </div>
    </div>
  </div>
  <script src="js/ex10_a.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</html>
