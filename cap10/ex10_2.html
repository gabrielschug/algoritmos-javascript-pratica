<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo 10.2</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/174/174854.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container-fluid">
    <div class="row mt-4">
      <div class="col-sm-3">
        <!-- imagem -->
      </div>
      <div class="col-sm-6" id="divMoedas">
        <form>
          <h1>Vamos Brincar de Dinheiro?</h1>
          <p>
            <label for="inSoma">A soma das moedas exibidas abaixo é:</label>
            <input type="number" min="0" step="0.05" class="form-control" id="inSoma" required autofocus>
          </p>
          <p>
            <input type="submit" id="submit" class="btn btn-primary" value="Conferir Resposta">
            <input type="reset" id="reset" class="btn btn-danger" value="Exibir Novas Moedas">
          </p>
        </form>
      </div>
    </div>
  </div>
  <script src="js/ex10_2.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
