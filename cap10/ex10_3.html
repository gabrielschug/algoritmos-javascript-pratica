<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo 10.3</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/174/174854.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container-fluid">
    <div class="row mt-4">
      <div class="col-sm-3">
        <!-- imagem -->
      </div>
      <div class="col-sm-6">
        <h1>Meus Filmes Favoritos</h1>
        <form>
          <p>
            <label for="inTitulo">Título do Filme:</label>
            <input type="text" class="form-control" id="inTitulo" required autofocus>
          </p>
          <p>
            <label for="inGenero">Gênero do Filme:</label>
            <input type="text" class="form-control" id="inGenero" required>
          </p>
          <input type="submit" class="btn btn-primary float-right mb-3" value="Adicionar">
        </form>
        <table class="table table-striped">
          <tr>
            <th>Título do Filme</th>
            <th>Gênero</th>
            <th>Ações</th>
          </tr>
        </table>
      </div>
    </div>
  </div>
  <script src="js/ex10_3.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
